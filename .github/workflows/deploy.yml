name: Deploy su GitHub Pages

# Compila i sorgenti Sass e pubblica il sito statico.
# Il CSS compilato è comunque committato nella repo (assets/css/main.css),
# quindi il sito resta funzionante anche se questo workflow non gira.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta; le run in coda vengono sostituite dall'ultima.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa le dipendenze
        run: npm ci

      - name: Compila Sass in CSS minificato
        run: npm run build

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Carica l'artefatto del sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
